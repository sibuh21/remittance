# Remittance Service Configuration
# Copy this file to config.yaml and fill in your credentials.
# NEVER commit config.yaml with real credentials to version control.

server:
  port: "8090"
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"
  request_timeout: "30s"

# ─── CyberSource (Inbound Collection) ───────────────────────────────────────
# Uses REST API with Flex Microform for secure, AFT-compliant card collection.
cybersource:
  # ─── REST API Keys ───
  # Generate these in CyberSource Business Center → Payment Configuration → Key Management
  merchant_id: "your_merchant_id"
  key_id: "your_rest_key_id"
  shared_secret: "your_rest_shared_secret"

  # ─── Endpoints ───
  # Sandbox: https://apitest.cybersource.com
  # Production: https://api.cybersource.com
  base_url: "https://apitest.cybersource.com"
  
  # 3DS Return URL (Where CyberSource redirects after 3DS challenge)
  # Locally: http://localhost:8090/api/collection/return
  return_url: "http://localhost:8090/api/collection/return"

# ─── Database (PostgreSQL) ──────────────────────────────────────────────────
# Default values for local development with docker-compose
database:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  dbname: "remittance"
  sslmode: "disable"

# ─── Bank of Abyssinia (Outbound Payout) ────────────────────────────────────
boa:
  base_url: "https://boapibeta.bankofabyssinia.com/remittance/InverseRemit"
  token_url: "https://boapibeta.bankofabyssinia.com/remittance/InverseRemit/oauth2"
  client_id: "your_boa_client_id"
  client_secret: "your_boa_client_secret"
  refresh_token: "your_initial_refresh_token"
  api_key: "your_boa_api_key"

cors:
  allowed_origins:
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://localhost:8090"
