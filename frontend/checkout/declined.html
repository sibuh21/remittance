<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Payment Declined | GlobalRemit</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <script>
        if (window.top !== window.self) {
            window.top.location.href = window.location.href;
        }
    </script>
    <div class="result-container">
        <div class="result-card">
            <div class="icon-box error">✕</div>
            <h1 class="card-title">Payment Declined</h1>
            <p class="card-subtitle">Your card issuer declined this transaction. Please try another card or contact your bank.</p>
            <a href="/" class="submit-btn" style="text-decoration:none; display:inline-block;">Back to Checkout</a>
        </div>
    </div>
</body>
</html>
