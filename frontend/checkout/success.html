<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>Transfer Successful | GlobalRemit</title>
    <link rel="stylesheet" href="../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="result-container">
        <div class="result-card">
            <div class="icon-box success">✓</div>
            <h1 class="card-title">Transfer Initiated!</h1>
            <p class="card-subtitle" id="status-msg">Your payment has been processed. We are now localizing the funds to the recipient.</p>
            
            <div id="txn-details" class="hidden">
                <div class="status-badge" id="payout-badge">Processing Payout</div>
                <div style="background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px; margin-bottom: 2rem; border: 1px solid var(--color-border);">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span style="color: var(--color-text-dim);">Reference</span>
                        <span id="ref-id" style="font-family: monospace;">...</span>
                    </div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem;">
                        <span style="color: var(--color-text-dim);">Recipient</span>
                        <span id="target-name">...</span>
                    </div>
                    <div style="display: flex; justify-content: space-between;">
                        <span style="color: var(--color-text-dim);">Amount</span>
                        <span id="target-amount" style="font-weight: 700;">...</span>
                    </div>
                </div>
            </div>

            <div id="payout-status-msg" style="margin-top: 1rem; padding: 1rem; border-radius: 8px; background: rgba(99, 102, 241, 0.1); color: var(--color-primary); font-size: 0.9rem;">
                <p id="payout-info">Automatic payout initiated. Please wait while we transfer funds to the recipient...</p>
            </div>

            <a href="/" class="submit-btn" style="text-decoration:none; display:inline-block; margin-top: 2rem;">Send Another Transfer</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('ref');
        let polling = true;
        
        async function checkStatus() {
            if (!ref || !polling) return;
            try {
                const res = await fetch(`/api/remittance/status/${ref}`);
                if (!res.ok) throw new Error("Status check failed");
                const data = await res.json();
                
                document.getElementById('txn-details').classList.remove('hidden');
                document.getElementById('ref-id').textContent = data.remittance_id;
                document.getElementById('target-name').textContent = data.receiver_name;
                document.getElementById('target-amount').textContent = `${data.target_amount} ${data.target_currency || 'ETB'}`;
                
                const badge = document.getElementById('payout-badge');
                const status = data.status || 'PROCESSING';
                badge.textContent = status.replace(/_/g, ' ');
                
                if (status === 'COMPLETED') {
                    badge.classList.add('completed');
                    document.getElementById('status-msg').textContent = "Funds delivered successfully!";
                    document.getElementById('payout-info').textContent = "The recipient has received the funds.";
                    document.getElementById('payout-status-msg').style.background = "rgba(34, 197, 94, 0.1)";
                    document.getElementById('payout-status-msg').style.color = "#22c55e";
                    polling = false;
                } else if (status === 'FAILED') {
                    badge.style.background = 'var(--color-error-bg)';
                    badge.style.color = 'var(--color-error)';
                    document.getElementById('status-msg').textContent = "Payout Issue Detected";
                    document.getElementById('payout-info').textContent = "There was an error during payout. Our support team will contact you shortly.";
                    document.getElementById('payout-status-msg').style.background = "rgba(239, 68, 68, 0.1)";
                    document.getElementById('payout-status-msg').style.color = "#ef4444";
                    polling = false;
                } else {
                    // Update info based on status
                    if (status === 'COLLECTED') {
                        document.getElementById('payout-info').textContent = "Payment collected. Triggering payout...";
                    } else if (status === 'PAYOUT_PROCESSING') {
                        document.getElementById('payout-info').textContent = "Payout is being processed by Bank of Abyssinia...";
                    }
                    setTimeout(checkStatus, 2000);
                }
            } catch (e) {
                console.error(e);
                setTimeout(checkStatus, 5000);
            }
        }

        checkStatus();
    </script>
</body>
</html>
